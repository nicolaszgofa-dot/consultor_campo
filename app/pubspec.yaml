name: consultor_campo
description: "Ferramentas de campo para agrônomos e consultores."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  avaliacao_plantio:
    path: ../packages/avaliacao_plantio
  configurador:
    path: ../packages/configurador
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/configurador/
  # Barlow (SIL Open Font License, assets/fonts/OFL.txt), embutida para
  # funcionar sem internet no campo.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
