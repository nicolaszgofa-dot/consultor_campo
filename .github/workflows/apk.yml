name: APK Android

# Gera o APK de instalação do app (assinado com a chave de depuração: serve
# para instalar direto no celular, não para a Play Store). O arquivo fica em
# "Artifacts" na página da execução.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "packages/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Compilar APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Nome do arquivo
        id: nome
        working-directory: app
        run: |
          versao=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "arquivo=consultor-campo-$versao-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.arquivo }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
